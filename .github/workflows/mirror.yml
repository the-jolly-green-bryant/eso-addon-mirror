name: Synchronize ESO add-on archive

on:
  schedule:
    # Once daily. GitHub may delay scheduled jobs during busy periods.
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: eso-addon-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BNET_USERNAME: ${{ secrets.BNET_USERNAME }}
      BNET_PASSWORD: ${{ secrets.BNET_PASSWORD }}
      GIT_AUTHOR_NAME: Bryant James
      GIT_AUTHOR_EMAIL: 137834469+the-jolly-green-bryant@users.noreply.github.com
      GIT_COMMITTER_NAME: Bryant James
      GIT_COMMITTER_EMAIL: 137834469+the-jolly-green-bryant@users.noreply.github.com
      MIRROR_SCOPE: all
      NO_COLOR: "1"
    steps:
      - name: Check out metadata without the archive payload
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scripts/
            /allowlist.txt
            /catalog.json
            /catalog-index.json
            /catalogs/
            /LICENSE
            /README.md
            /addons/*.md
            /addons/*/*/addon.json
            /addons/*/*/.mirror-omitted.json
            /addons/*/*/ARCHIVE_UNAVAILABLE.md

      - name: Install pinned Bethesda ESO CLI
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/sirinsidiator/ESOAddOnUploaderCLI/releases/download/1.4.0/ESOAddOnUploaderCli-linux.tar.gz"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/esocli.tar.gz"
          echo "74a263859b5cff215501f91c59fdb3b8a8c829dd2d9d347c6c014b7c18336ec1  $RUNNER_TEMP/esocli.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/esocli"
          tar -xzf "$RUNNER_TEMP/esocli.tar.gz" -C "$RUNNER_TEMP/esocli"
          chmod +x "$RUNNER_TEMP/esocli/ESOAddOnUploaderCli"
          echo "$RUNNER_TEMP/esocli" >> "$GITHUB_PATH"

      - name: Refresh Console add-ons from Bethesda
        id: bethesda
        continue-on-error: true
        run: python3 scripts/mirror.py

      - name: Refresh PC and Mac add-ons from ESOUI
        id: esoui
        continue-on-error: true
        run: python3 scripts/sync_esoui.py --main-repository

      - name: Publish changed add-ons and catalogs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The mirror is already current."
            exit 0
          fi
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          git add --sparse -A -- addons catalogs catalog.json catalog-index.json
          git commit -m "mirror: daily Console and PC refresh"
          git push

      - name: Report incomplete synchronization
        if: steps.bethesda.outcome == 'failure' || steps.esoui.outcome == 'failure'
        run: |
          echo "One or more upstream releases could not be synchronized."
          echo "Successful changes were committed; failures will retry tomorrow."
          exit 1
